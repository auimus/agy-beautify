<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">AGY Beautify — Antigravity 2.0 液态玻璃美化、系统字体与深度汉化插件</title>
  <desc id="hero-desc">零依赖 Google Antigravity 2.0 原生插件，集成液态玻璃主题、本机系统字体与字重定制、2,750+ 词条深度汉化、Gemini 星尘滑条、自动压缩与全屏 Token/美元监控台。</desc>

  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="52%" stop-color="#0E1730"/>
      <stop offset="100%" stop-color="#14132C"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="18%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="84%" cy="72%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="62%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="52%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sliderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2642" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="26" fill="url(#canvasBg)"/>
  <rect width="1200" height="400" rx="26" fill="url(#glowBlue)"/>
  <rect width="1200" height="400" rx="26" fill="url(#glowViolet)"/>
  <rect width="1200" height="400" rx="26" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="1198" height="398" rx="25" fill="none" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Left: Identity & Value -->
  <g id="title-block" transform="translate(56 48)">
    <!-- Native Logo Emblem -->
    <rect x="0" y="0" width="54" height="54" rx="15" fill="url(#brandGrad)"/>
    <path d="M27 10 C28.8 20.4 33.6 25.2 44 27 C33.6 28.8 28.8 33.6 27 44 C25.2 33.6 20.4 28.8 10 27 C20.4 25.2 25.2 20.4 27 10 Z" fill="#FFFFFF"/>
    <circle cx="40" cy="14" r="2.6" fill="#FDE68A"/>

    <!-- Category Badge -->
    <rect x="70" y="11" width="388" height="32" rx="16" fill="#1E293B" fill-opacity="0.82" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="264" y="33" text-anchor="middle" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">ANTIGRAVITY 2.0 · PLUGIN · v1.6.0</text>

    <!-- Display Name -->
    <text x="0" y="124" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" letter-spacing="-0.5">AGY Beautify</text>

    <!-- Plain-language Value -->
    <text x="0" y="170" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600">液态玻璃 · 本机系统字体与字重 · 2,750+ 深度汉化</text>
    <text x="0" y="206" fill="#9FB0C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400">星尘模型滑条 · 上下文自动压缩 · Token 与美元监控台</text>

    <!-- Key Attributes Row -->
    <g transform="translate(0 246)">
      <rect x="0" y="0" width="112" height="38" rx="19" fill="#16213A" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1.2"/>
      <text x="56" y="25" text-anchor="middle" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600">零依赖</text>

      <rect x="124" y="0" width="166" height="38" rx="19" fill="#16213A" stroke="#818CF8" stroke-opacity="0.38" stroke-width="1.2"/>
      <text x="207" y="25" text-anchor="middle" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600">零改 app.asar</text>

      <rect x="302" y="0" width="118" height="38" rx="19" fill="#16213A" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.2"/>
      <text x="361" y="25" text-anchor="middle" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600">无损热载</text>

      <rect x="432" y="0" width="106" height="38" rx="19" fill="#16213A" stroke="#FBBF24" stroke-opacity="0.38" stroke-width="1.2"/>
      <text x="485" y="25" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">MIT</text>
    </g>
  </g>

  <!-- Right: Native Quick Studio & Font Control Specimen -->
  <g id="project-proof" transform="translate(656 38)">
    <!-- Outer Glass Panel -->
    <rect x="0" y="0" width="488" height="324" rx="20" fill="url(#glassCard)" stroke="#94A3B8" stroke-opacity="0.28" stroke-width="1.4"/>

    <!-- Panel Header -->
    <text x="24" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700">✦ Quick Studio</text>
    <rect x="366" y="18" width="98" height="32" rx="16" fill="#064E3B" fill-opacity="0.72" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="415" y="40" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600">已生效</text>

    <line x1="24" y1="62" x2="464" y2="62" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="1"/>

    <!-- System Font & Weight Module -->
    <rect x="24" y="76" width="440" height="104" rx="14" fill="#0B1325" fill-opacity="0.76" stroke="#6366F1" stroke-opacity="0.32" stroke-width="1.2"/>
    <text x="42" y="106" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">Aa 系统字体与字重</text>
    <text x="446" y="106" text-anchor="end" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">Maple Mono · 500</text>

    <!-- Weight Slider Bar -->
    <rect x="42" y="128" width="320" height="12" rx="6" fill="#1E293B"/>
    <rect x="42" y="128" width="192" height="12" rx="6" fill="url(#sliderGrad)"/>
    <circle cx="234" cy="134" r="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="3"/>
    <text x="446" y="140" text-anchor="end" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">100–900</text>
    <text x="42" y="167" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">界面 / 代码独立字体 · 自动扫描本机已装字库</text>

    <!-- Feature Pills Row -->
    <g transform="translate(24 194)">
      <rect x="0" y="0" width="212" height="44" rx="12" fill="#1E293B" fill-opacity="0.72" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2"/>
      <text x="106" y="29" text-anchor="middle" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="600">💧 液态玻璃 / 壁纸</text>

      <rect x="228" y="0" width="212" height="44" rx="12" fill="#1E293B" fill-opacity="0.72" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.2"/>
      <text x="334" y="29" text-anchor="middle" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="600">中 2,750+ 深度汉化</text>
