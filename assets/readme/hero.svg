    <!-- Bottom Live Telemetry Capsule -->
    <rect x="24" y="254" width="440" height="48" rx="24" fill="#0B1325" fill-opacity="0.88" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1.3"/>
    <text x="244" y="285" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">✦ 58% · 116K · 额度 78% · ↻ 2h45m</text>
  </g>
</svg>
