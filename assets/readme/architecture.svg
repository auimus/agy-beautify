<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">AGY Beautify 零侵入架构图</title>
  <desc id="arch-desc">展示本地字体库、中文词典与只读 SQLite 如何经由零依赖 Node.js Sidecar 与 CDP 实时注入 Antigravity 2.0 界面，且全程不修改 app.asar。</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090E1C"/>
      <stop offset="100%" stop-color="#111932"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#archBg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1.4"/>

  <!-- Heading -->
  <text x="52" y="50" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700">零侵入工作原理 · Zero-Invasive Sidecar &amp; CDP Pipeline</text>

  <!-- Stage 1: Local Sources -->
  <g transform="translate(52 76)">
    <rect x="0" y="0" width="320" height="202" rx="16" fill="#141F38" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1.3"/>
    <text x="22" y="38" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700">1. 本地离线数据源</text>
    <line x1="22" y1="54" x2="298" y2="54" stroke="#94A3B8" stroke-opacity="0.2" stroke-width="1"/>
    <text x="22" y="88" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">• 本机系统字体 (GDI+ / fc-list)</text>
    <text x="22" y="128" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">• 2,750+ 词条 &amp; 180+ 动态规则</text>
    <text x="22" y="168" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">• 本地会话 SQLite (纯只读解析)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="382" y1="177" x2="424" y2="177" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <polygon points="420,169 435,177 420,185" fill="#818CF8"/>

  <!-- Stage 2: Native Sidecar -->
  <g transform="translate(440 76)">
    <rect x="0" y="0" width="320" height="202" rx="16" fill="#162040" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.3"/>
    <text x="22" y="38" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700">2. 原生 Sidecar 服务</text>
    <line x1="22" y1="54" x2="298" y2="54" stroke="#94A3B8" stroke-opacity="0.2" stroke-width="1"/>
    <text x="22" y="88" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">server.mjs · fonts.mjs</text>
    <text x="22" y="128" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">telemetry.mjs · updater.mjs</text>
    <text x="22" y="168" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">零依赖 Node.js · 本地回环热重载</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="770" y1="177" x2="812" y2="177" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  <polygon points="808,169 823,177 808,185" fill="#34D399"/>

  <!-- Stage 3: Live CDP Injection -->
  <g transform="translate(828 76)">
    <rect x="0" y="0" width="320" height="202" rx="16" fill="#122638" stroke="#34D399" stroke-opacity="0.42" stroke-width="1.3"/>
    <text x="22" y="38" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700">3. CDP 实时注入界面</text>
    <line x1="22" y1="54" x2="298" y2="54" stroke="#94A3B8" stroke-opacity="0.2" stroke-width="1"/>
    <text x="22" y="88" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">• 液态玻璃 &amp; 自定义字体/字重</text>
    <text x="22" y="128" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">• 深度 DOM 汉化 &amp; 右键定位</text>
    <text x="22" y="168" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">• 星尘滑条 · 快捷浮窗 · 监控台</text>
  </g>

  <!-- Footer Note -->
  <text x="52" y="314" fill="#9FB0C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">不修改客户端 app.asar 或二进制文件 · 停用插件即 100% 无损还原 · 需带 --remote-debugging-port=0 启动</text>
</svg>
